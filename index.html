<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oboro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Noto+Sans+TC:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 單一主題：白底黑字，照排版稿；欄寬以手機 375px 為基準，桌機置中 */
      --bg: #ffffff;
      --ink: #000000;
      --dot: #e3e3e3;
      --font: "Montserrat", "Noto Sans TC", system-ui, sans-serif;
      --font-zh: "Montserrat", "Noto Sans TC", "PingFang TC", sans-serif;
      --col: min(100vw, 440px);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 600;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }
    img { display: block; max-width: 100%; }

    .page { display: none; width: var(--col); margin: 0 auto; }
    .page.is-active { display: flex; }

    /* ---------- 首頁 ---------- */
    #page-home, #page-info {
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding-bottom: calc(var(--col) * 0.12);
    }
    .home-top { flex: 1.15 1 0; min-height: 32px; }
    .home-photo { width: 78%; aspect-ratio: 1; object-fit: cover; }
    .home-mid { flex: 1.5 1 0; min-height: 48px; }
    .nav {
      display: flex;
      gap: 1.2em;
      font-size: calc(var(--col) * 0.067);
      line-height: 1;
    }
    .nav a { padding: 0.1em 0; }
    .home-logo { display: block; width: 77.5%; height: auto; margin-top: calc(var(--col) * 0.05); }

    /* ---------- info：沿用首頁骨架，back 對齊首頁 info / shop ---------- */
    #page-info { text-align: center; }
    .info-body { width: 78%; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; gap: 29px; }
    .logo-spacer { aspect-ratio: 595.44 / 175.94; visibility: hidden; }
    .info-zh { margin: 0; font-family: var(--font-zh); font-size: 16px; line-height: 1.25; }
    .info-en { margin: 0; font-size: 13px; line-height: 1.25; }
    .info-zh span { display: block; }
    .back-link { font-size: 26px; line-height: 1; }

    /* ---------- 產品頁 ---------- */
    #page-saku {
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 96px;
    }
    .carousel {
      width: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 100%; aspect-ratio: 1; scroll-snap-align: start; }
    .slide img { width: 100%; height: 100%; object-fit: cover; }
    .dots { display: flex; gap: 5px; margin-top: 17px; }
    .dots button {
      width: 6px; height: 6px; padding: 0; border: 0; border-radius: 50%;
      background: var(--dot); cursor: pointer;
    }
    .dots button[aria-current="true"] { background: var(--ink); }
    .product-title { margin: 40px 0 0; font-size: 28px; line-height: 1.02; font-weight: 600; text-wrap: balance; }
    .price { margin: 40px 0 0; font-size: 19px; line-height: 1; letter-spacing: -0.03em; }
    .swatches { display: flex; align-items: center; gap: 10px; height: 26px; margin-top: 23px; }
    .swatches button {
      width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    }
    .swatches button[aria-pressed="true"] { width: 26px; height: 26px; }
    .bag {
      margin-top: 33px; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer;
    }
    .bag svg { display: block; width: 44px; height: 44px; }
    .specs { margin: 38px 0 0; font-size: 13px; line-height: 15px; font-weight: 600; }
    .specs p { margin: 0; }
    .specs .origin { margin-top: 15px; }
    #page-saku .back-link { margin-top: 64px; }

    @media (prefers-reduced-motion: no-preference) {
      .carousel { scroll-behavior: smooth; }
      .swatches button { transition: width 0.2s, height 0.2s; }
    }
  </style>
</head>
<body>

    <div class="home-mid"></div>
    <nav class="nav" aria-label="主選單">
      <a href="#info">info</a>

  </main>

  <!-- info -->
  <main class="page" id="page-info" aria-label="關於 oboro">
    <div class="home-top"></div>
    <div class="info-body">
      <p class="info-zh"><span>oboro是位於台北的燈具創作工作室，</span><span>作品以3D列印與手工少量製作。</span></p>
      <p class="info-en">A lighting design studio based in Taipei.<br>Each piece is 3D printed and handcrafted<br>in small batches.</p>
    </div>
    <div class="home-mid"></div>
    <nav class="nav" aria-label="返回">
      <a href="#">back</a>
    </nav>
    <div class="home-logo logo-spacer" aria-hidden="true"></div>

  <!-- 產品頁 -->

    <div class="dots" id="dots" role="group" aria-label="切換照片"></div>

    <a class="back-link" href="#">back</a>

  <script>
    // 產品資料：加新顏色或新產品就改這裡
    const product = {
      line: 'Lamp Saku',
      price: 1100,
      variants: [
        { id: 'kawazu', name: 'Kawazu', label: '白', swatch: '#e3e3e3', photos: 6 },
        { id: 'oshima', name: 'Oshima', label: '粉紅', swatch: '#ffd3e3', photos: 6 },
      ],
    };

    const pages = { info: 'page-info', saku: 'page-saku' };
    const carousel = document.getElementById('carousel');
    const dots = document.getElementById('dots');
    const swatches = document.getElementById('swatches');

    function route() {
      const id = pages[location.hash.slice(1)] || 'page-home';
      document.querySelectorAll('.page').forEach(p => p.classList.toggle('is-active', p.id === id));
      window.scrollTo(0, 0);
      if (id === 'page-saku') syncDots();
    }

    function syncDots() {
      const i = Math.round(carousel.scrollLeft / (carousel.clientWidth || 1));
      [...dots.children].forEach((d, j) => d.setAttribute('aria-current', j === i ? 'true' : 'false'));
    }

    function showVariant(v) {
      document.getElementById('product-title').innerHTML = product.line + '<br>' + v.name;
      document.getElementById('price').textContent = '$ ' + product.price;
      carousel.innerHTML = '';
      dots.innerHTML = '';
      for (let i = 1; i <= v.photos; i++) {
        const slide = document.createElement('div');
        slide.className = 'slide';
        const img = document.createElement('img');
        img.src = 'img/' + v.id + '-' + i + '.jpg';
        img.alt = product.line + ' ' + v.name + ' 照片 ' + i;
        if (i > 1) img.loading = 'lazy';
        slide.appendChild(img);
        carousel.appendChild(slide);

        const b = document.createElement('button');
        b.type = 'button';
        b.id = 'dot-' + i;
        b.setAttribute('aria-label', '第 ' + i + ' 張');
        b.addEventListener('click', () => carousel.scrollTo({ left: carousel.clientWidth * (i - 1) }));
        dots.appendChild(b);
      }
      carousel.scrollLeft = 0;
      [...swatches.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.id === v.id ? 'true' : 'false'));
      syncDots();
    }

    product.variants.forEach(v => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = 'swatch-' + v.id;
      b.dataset.id = v.id;
      b.style.background = v.swatch;
      b.setAttribute('aria-label', v.label + ' ' + v.name);
      b.addEventListener('click', () => showVariant(v));
      swatches.appendChild(b);
    });

    carousel.addEventListener('scroll', syncDots, { passive: true });
    window.addEventListener('hashchange', route);
    showVariant(product.variants[0]);
    route();
  </script>
</body>
